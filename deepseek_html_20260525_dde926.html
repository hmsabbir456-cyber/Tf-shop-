<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>গ্যাজেট বিডি | গুগল লগইন সহ ই-কমার্স</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .app-container {
            max-width: 500px;
            width: 100%;
            background: #f8f9fa;
            border-radius: 30px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            position: relative;
            min-height: 85vh;
        }
        
        /* Auth Screen */
        .auth-screen {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 40px 25px;
            min-height: 85vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        
        .auth-card {
            background: rgba(255,255,255,0.95);
            border-radius: 25px;
            padding: 30px 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            text-align: center;
        }
        
        .auth-card h2 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }
        
        .auth-card h2 i {
            color: #e67e22;
        }
        
        .auth-card p {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .google-btn {
            width: 100%;
            padding: 14px;
            background: #fff;
            color: #333;
            border: 1px solid #ddd;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 15px;
        }
        
        .google-btn:hover {
            background: #f8f9fa;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .google-btn i {
            font-size: 20px;
            color: #db4437;
        }
        
        .divider {
            text-align: center;
            margin: 20px 0;
            position: relative;
        }
        
        .divider::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: #ddd;
        }
        
        .divider span {
            background: #fff;
            padding: 0 15px;
            position: relative;
            color: #999;
            font-size: 12px;
        }
        
        /* Main App */
        .main-app {
            display: none;
        }
        
        .main-app.active {
            display: block;
        }
        
        /* Header */
        .header {
            background: linear-gradient(135deg, #e67e22, #d35400);
            padding: 20px 15px;
            color: #fff;
        }
        
        .header h2 {
            font-size: 20px;
            margin-bottom: 5px;
        }
        
        .header p {
            font-size: 12px;
            opacity: 0.9;
        }
        
        .user-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(255,255,255,0.2);
        }
        
        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #fff;
        }
        
        .user-details {
            flex: 1;
            margin-left: 12px;
        }
        
        .user-details .name {
            font-size: 14px;
            font-weight: 600;
        }
        
        .user-details .email {
            font-size: 10px;
            opacity: 0.8;
        }
        
        .logout-btn {
            background: rgba(255,255,255,0.2);
            border: none;
            padding: 8px 15px;
            border-radius: 20px;
            color: #fff;
            cursor: pointer;
            font-size: 12px;
        }
        
        /* Search Bar */
        .search-section {
            padding: 15px;
            background: #fff;
            border-bottom: 1px solid #eee;
        }
        
        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }
        
        .search-box input {
            flex: 1;
            padding: 10px 15px;
            border: 1px solid #e0e0e0;
            border-radius: 25px;
            font-size: 14px;
        }
        
        .category-filter {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 5px;
        }
        
        .category-btn {
            padding: 6px 15px;
            background: #f0f0f0;
            border: none;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }
        
        .category-btn.active {
            background: #e67e22;
            color: #fff;
        }
        
        /* Product Grid */
        .product-grid {
            padding: 15px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            max-height: 55vh;
            overflow-y: auto;
        }
        
        .product-card {
            background: #fff;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            transition: all 0.3s;
            cursor: pointer;
        }
        
        .product-card:active {
            transform: scale(0.98);
        }
        
        .product-img {
            width: 100%;
            height: 120px;
            object-fit: cover;
            background: #f5f5f5;
        }
        
        .product-info {
            padding: 10px;
        }
        
        .product-name {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 5px;
            color: #333;
        }
        
        .product-price {
            font-size: 16px;
            font-weight: 700;
            color: #e67e22;
        }
        
        .old-price {
            font-size: 11px;
            color: #999;
            text-decoration: line-through;
            margin-left: 5px;
        }
        
        .buy-now-btn {
            width: 100%;
            padding: 6px;
            background: #e67e22;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 600;
            margin-top: 8px;
            cursor: pointer;
        }
        
        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        
        .modal.active {
            display: flex;
        }
        
        .modal-content {
            background: #fff;
            width: 90%;
            max-width: 400px;
            border-radius: 25px;
            overflow: hidden;
            animation: slideUp 0.3s ease;
            max-height: 90vh;
            overflow-y: auto;
        }
        
        @keyframes slideUp {
            from {
                transform: translateY(50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
        
        .modal-img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }
        
        .modal-body {
            padding: 20px;
        }
        
        .modal-body h3 {
            margin-bottom: 10px;
            color: #333;
        }
        
        .quantity-selector {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #f8f9fa;
            padding: 12px;
            border-radius: 12px;
            margin: 15px 0;
        }
        
        .qty-btn {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            border: 1px solid #ddd;
            background: #fff;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
        }
        
        .qty-value {
            font-size: 20px;
            font-weight: 600;
            min-width: 50px;
            text-align: center;
        }
        
        .delivery-charge {
            background: #fff3e0;
            padding: 12px;
            border-radius: 12px;
            margin: 15px 0;
        }
        
        .delivery-charge label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }
        
        .total-amount {
            background: #e67e22;
            color: #fff;
            padding: 12px;
            border-radius: 12px;
            text-align: center;
            margin: 15px 0;
        }
        
        .total-amount span {
            font-size: 24px;
            font-weight: 700;
        }
        
        .checkout-form input, .checkout-form textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 14px;
        }
        
        .confirm-order-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #27ae60, #2ecc71);
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }
        
        .close-modal {
            width: 100%;
            padding: 10px;
            background: #e74c3c;
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            cursor: pointer;
            margin-top: 10px;
        }
        
        /* Toast */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #333;
            color: #fff;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 14px;
            z-index: 1100;
            animation: fadeInUp 0.3s ease;
        }
        
        @keyframes fadeInUp {
            from {
                bottom: 0;
                opacity: 0;
            }
            to {
                bottom: 30px;
                opacity: 1;
            }
        }
        
        .empty-state {
            text-align: center;
            padding: 50px;
            color: #999;
        }
        
        .empty-state i {
            font-size: 50px;
            margin-bottom: 15px;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #e67e22;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        ::-webkit-scrollbar {
            width: 3px;
        }
        
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        
        ::-webkit-scrollbar-thumb {
            background: #e67e22;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Auth Screen -->
        <div class="auth-screen" id="authScreen">
            <div class="auth-card">
                <h2><i class="fas fa-mobile-alt"></i> Gadget BD</h2>
                <p>প্রিমিয়াম গ্যাজেটের সেরা ঠিকানা</p>
                
                <button class="google-btn" id="googleLoginBtn">
                    <i class="fab fa-google"></i> গুগল দিয়ে লগইন করুন
                </button>
                
                <div class="divider">
                    <span>গেস্ট হিসেবে ব্রাউজ করুন</span>
                </div>
                
                <button class="google-btn" id="guestLoginBtn" style="background:#f0f0f0;">
                    <i class="fas fa-user"></i> গেস্ট মোড
                </button>
            </div>
        </div>
        
        <!-- Main App -->
        <div class="main-app" id="mainApp">
            <div class="header">
                <h2><i class="fas fa-store"></i> Gadget BD</h2>
                <p>প্রিমিয়াম গ্যাজেটের সেরা ঠিকানা</p>
                <div class="user-info">
                    <img id="userAvatar" class="user-avatar" src="https://ui-avatars.com/api/?background=e67e22&color=fff" alt="">
                    <div class="user-details">
                        <div class="name" id="userName">ইউজার</div>
                        <div class="email" id="userEmail">user@example.com</div>
                    </div>
                    <button class="logout-btn" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> লগআউট</button>
                </div>
            </div>
            
            <div class="search-section">
                <div class="search-box">
                    <i class="fas fa-search" style="align-self:center; color:#999;"></i>
                    <input type="text" id="searchInput" placeholder="গ্যাজেট অনুসন্ধান...">
                </div>
                <div class="category-filter" id="categoryFilter">
                    <button class="category-btn active" data-cat="all">সব</button>
                </div>
            </div>
            
            <div id="productGrid" class="product-grid">
                <div class="loading"><div class="spinner"></div><p>প্রোডাক্ট লোড হচ্ছে...</p></div>
            </div>
        </div>
    </div>
    
    <!-- Product Modal -->
    <div class="modal" id="productModal">
        <div class="modal-content">
            <img id="modalImg" class="modal-img" src="" alt="">
            <div class="modal-body">
                <h3 id="modalName"></h3>
                <p id="modalPrice" style="color:#e67e22; font-size:20px; font-weight:700;"></p>
                
                <div class="quantity-selector">
                    <button class="qty-btn" id="decreaseQty">−</button>
                    <span class="qty-value" id="qtyValue">1</span>
                    <button class="qty-btn" id="increaseQty">+</button>
                </div>
                
                <div class="delivery-charge">
                    <label>
                        <span><i class="fas fa-truck"></i> ডেলিভারি চার্জ</span>
                        <input type="checkbox" id="deliveryCheckbox" checked> +৬০ টাকা
                    </label>
                </div>
                
                <div class="total-amount">
                    মোট মূল্য: <span id="totalAmount">৳ 0</span>
                </div>
                
                <div class="checkout-form">
                    <input type="text" id="customerName" placeholder="পূর্ণ নাম *">
                    <input type="tel" id="customerPhone" placeholder="মোবাইল নম্বর *">
                    <input type="text" id="customerAddress" placeholder="ঠিকানা *">
                    <textarea id="customerNote" placeholder="বিশেষ দরকার (ঐচ্ছিক)" rows="2"></textarea>
                </div>
                
                <button class="confirm-order-btn" onclick="placeOrder()">
                    <i class="fas fa-check-circle"></i> অর্ডার কনফার্ম করুন
                </button>
                <button class="close-modal" onclick="closeModal()">
                    <i class="fas fa-times"></i> বাতিল
                </button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        
        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyCs7cltGGmb86lOCzlh5lJsfb0LQxn0iMI",
            authDomain: "tf-official-72b4f.firebaseapp.com",
            databaseURL: "https://tf-official-72b4f-default-rtdb.firebaseio.com",
            projectId: "tf-official-72b4f",
            storageBucket: "tf-official-72b4f.firebasestorage.app",
            messagingSenderId: "9156827436",
            appId: "1:9156827436:web:21d1f4f98104c726afb489"
        };
        
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();
        
        // Global Variables
        let currentUser = null;
        let allProducts = [];
        let selectedProduct = null;
        let selectedQuantity = 1;
        
        // Check Auth State on Load
        onAuthStateChanged(auth, (user) => {
            if (user) {
                // User is signed in
                currentUser = {
                    uid: user.uid,
                    name: user.displayName,
                    email: user.email,
                    photoURL: user.photoURL
                };
                showMainApp();
                saveUserToFirebase();
            } else {
                // Check local storage for guest
                const guestUser = localStorage.getItem('guestUser');
                if (guestUser) {
                    currentUser = JSON.parse(guestUser);
                    showMainApp();
                } else {
                    showAuthScreen();
                }
            }
        });
        
        function showMainApp() {
            document.getElementById('authScreen').style.display = 'none';
            document.getElementById('mainApp').classList.add('active');
            document.getElementById('userName').innerText = currentUser.name || 'গেস্ট ইউজার';
            document.getElementById('userEmail').innerText = currentUser.email || 'guest@example.com';
            if (currentUser.photoURL) {
                document.getElementById('userAvatar').src = currentUser.photoURL;
            }
            loadProducts();
        }
        
        function showAuthScreen() {
            document.getElementById('authScreen').style.display = 'flex';
            document.getElementById('mainApp').classList.remove('active');
        }
        
        function saveUserToFirebase() {
            if (currentUser && currentUser.uid) {
                const userRef = ref(db, 'users/' + currentUser.uid);
                push(userRef, {
                    name: currentUser.name,
                    email: currentUser.email,
                    photoURL: currentUser.photoURL,
                    lastLogin: new Date().toISOString()
                });
            }
        }
        
        // Toast function
        function showToast(message, isError = false) {
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.style.background = isError ? '#e74c3c' : '#27ae60';
            toast.innerHTML = `<i class="fas ${isError ? 'fa-exclamation-triangle' : 'fa-check-circle'}"></i> ${message}`;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }
        
        // Google Login
        document.getElementById('googleLoginBtn').addEventListener('click', async () => {
            try {
                const result = await signInWithPopup(auth, provider);
                showToast(`স্বাগতম ${result.user.displayName}!`);
            } catch (error) {
                console.error(error);
                showToast('গুগল লগইন ব্যর্থ হয়েছে', true);
            }
        });
        
        // Guest Login
        document.getElementById('guestLoginBtn').addEventListener('click', () => {
            const guestUser = {
                name: 'গেস্ট ইউজার',
                email: 'guest_' + Date.now() + '@example.com',
                isGuest: true
            };
            localStorage.setItem('guestUser', JSON.stringify(guestUser));
            currentUser = guestUser;
            showMainApp();
            showToast('গেস্ট মোডে স্বাগতম!');
        });
        
        // Logout
        document.getElementById('logoutBtn').addEventListener('click', async () => {
            if (currentUser && !currentUser.isGuest) {
                await signOut(auth);
            }
            localStorage.removeItem('guestUser');
            currentUser = null;
            showAuthScreen();
            showToast('লগআউট সফল');
        });
        
        // Load Products
        function loadProducts() {
            onValue(ref(db, 'products'), (snapshot) => {
                allProducts = [];
                if (snapshot.exists()) {
                    snapshot.forEach(child => {
                        allProducts.push({ id: child.key, ...child.val() });
                    });
                }
                renderProducts();
                renderCategories();
            });
        }
        
        function renderProducts(searchTerm = '', category = 'all') {
            const container = document.getElementById('productGrid');
            let filtered = allProducts;
            
            if (searchTerm) {
                filtered = filtered.filter(p => p.name?.toLowerCase().includes(searchTerm.toLowerCase()));
            }
            
            if (category !== 'all') {
                filtered = filtered.filter(p => p.category === category);
            }
            
            if (filtered.length === 0) {
                container.innerHTML = `<div class="empty-state"><i class="fas fa-box-open"></i><p>কোন প্রোডাক্ট পাওয়া যায়নি</p></div>`;
                return;
            }
            
            let html = '';
            filtered.forEach(prod => {
                html += `
                    <div class="product-card" onclick="openProductModal('${prod.id}')">
                        <img class="product-img" src="${prod.img || 'https://via.placeholder.com/150'}" onerror="this.src='https://via.placeholder.com/150'" alt="${prod.name}">
                        <div class="product-info">
                            <div class="product-name">${prod.name}</div>
                            <div class="product-price">
                                ৳ ${prod.price}
                                ${prod.oldPrice ? `<span class="old-price">৳ ${prod.oldPrice}</span>` : ''}
                            </div>
                            <button class="buy-now-btn" onclick="event.stopPropagation(); openProductModal('${prod.id}')">
                                🛒 কিনুন
                            </button>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }
        
        function renderCategories() {
            const categories = ['স্মার্টফোন', 'ল্যাপটপ', 'ট্যাবলেট', 'হেডফোন', 'স্মার্টওয়াচ'];
            const container = document.getElementById('categoryFilter');
            container.innerHTML = '<button class="category-btn active" data-cat="all">সব</button>';
            
            categories.forEach(cat => {
                container.innerHTML += `<button class="category-btn" data-cat="${cat}">${cat}</button>`;
            });
            
            document.querySelectorAll('.category-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    const searchTerm = document.getElementById('searchInput').value;
                    renderProducts(searchTerm, this.getAttribute('data-cat'));
                });
            });
        }
        
        // Search
        document.getElementById('searchInput').addEventListener('input', (e) => {
            const activeCat = document.querySelector('.category-btn.active').getAttribute('data-cat');
            renderProducts(e.target.value, activeCat);
        });
        
        // Open Modal
        window.openProductModal = (productId) => {
            const product = allProducts.find(p => p.id === productId);
            if (!product) return;
            
            selectedProduct = product;
            selectedQuantity = 1;
            
            document.getElementById('modalImg').src = product.img || 'https://via.placeholder.com/300';
            document.getElementById('modalName').innerText = product.name;
            document.getElementById('modalPrice').innerHTML = `৳ ${product.price}`;
            document.getElementById('qtyValue').innerText = selectedQuantity;
            
            if (currentUser) {
                document.getElementById('customerName').value = currentUser.name || '';
            }
            
            updateTotalAmount();
            document.getElementById('productModal').classList.add('active');
        };
        
        function updateTotalAmount() {
            const productTotal = selectedProduct.price * selectedQuantity;
            const delivery = document.getElementById('deliveryCheckbox').checked ? 60 : 0;
            const total = productTotal + delivery;
            document.getElementById('totalAmount').innerHTML = `৳ ${total}`;
        }
        
        // Quantity controls
        document.getElementById('decreaseQty')?.addEventListener('click', () => {
            if (selectedQuantity > 1) {
                selectedQuantity--;
                document.getElementById('qtyValue').innerText = selectedQuantity;
                updateTotalAmount();
            }
        });
        
        document.getElementById('increaseQty')?.addEventListener('click', () => {
            selectedQuantity++;
            document.getElementById('qtyValue').innerText = selectedQuantity;
            updateTotalAmount();
        });
        
        document.getElementById('deliveryCheckbox')?.addEventListener('change', () => {
            updateTotalAmount();
        });
        
        window.closeModal = () => {
            document.getElementById('productModal').classList.remove('active');
        };
        
        // Place Order
        window.placeOrder = () => {
            if (!currentUser) {
                showToast('দয়া করে লগইন করুন', true);
                closeModal();
                return;
            }
            
            const name = document.getElementById('customerName').value.trim();
            const phone = document.getElementById('customerPhone').value.trim();
            const address = document.getElementById('customerAddress').value.trim();
            const note = document.getElementById('customerNote').value.trim();
            
            if (!name || !phone || !address) {
                showToast('দয়া করে নাম, মোবাইল এবং ঠিকানা দিন', true);
                return;
            }
            
            if (!/^01[3-9]\d{8}$/.test(phone)) {
                showToast('সঠিক মোবাইল নম্বর দিন (01XXXXXXXXX)', true);
                return;
            }
            
            const productTotal = selectedProduct.price * selectedQuantity;
            const delivery = document.getElementById('deliveryCheckbox').checked ? 60 : 0;
            const totalAmount = productTotal + delivery;
            
            const orderData = {
                customerName: name,
                customerEmail: currentUser.email,
                customerUid: currentUser.uid || 'guest',
                phone: phone,
                address: address,
                notes: note,
                productName: selectedProduct.name,
                productPrice: selectedProduct.price,
                quantity: selectedQuantity,
                deliveryCharge: delivery,
                totalAmount: totalAmount,
                status: "Pending",
                orderDate: new Date().toISOString()
            };
            
            push(ref(db, 'orders'), orderData).then(() => {
                showToast(`✅ অর্ডার সফল! মোট: ৳ ${totalAmount}`);
                closeModal();
                document.getElementById('customerPhone').value = '';
                document.getElementById('customerAddress').value = '';
                document.getElementById('customerNote').value = '';
            }).catch((error) => {
                showToast('অর্ডার করতে ব্যর্থ হয়েছে', true);
                console.error(error);
            });
        };
        
        // Close modal on outside click
        document.getElementById('productModal').addEventListener('click', (e) => {
            if (e.target === document.getElementById('productModal')) {
                closeModal();
            }
        });
    </script>
</body>
</html>
